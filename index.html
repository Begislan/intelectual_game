<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Интеллектуалдык оюн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d2e; --indigo:#23267a; --violet:#4b3fd6;
  --gold:#ffb81f; --cyan:#3be3e0; --paper:#f1eeff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:radial-gradient(ellipse at 50% 120%,var(--indigo) 0%,var(--ink) 60%);
  color:var(--paper);
  font-family:"Manrope",system-ui,sans-serif;
  overflow:hidden;
  display:grid;place-items:center;
  position:relative;
}

/* Прожекторлор */
.beams{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.beam{
  position:absolute;top:-10%;left:50%;width:34vmax;height:120vmax;
  transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(59,227,224,.28),transparent 70%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);
  filter:blur(6px);
  animation:sweep 9s ease-in-out infinite alternate;
}
.beam:nth-child(2){background:linear-gradient(180deg,rgba(255,184,31,.26),transparent 70%);animation-delay:-4s;animation-duration:11s}
.beam:nth-child(3){background:linear-gradient(180deg,rgba(120,100,255,.3),transparent 70%);animation-delay:-7s;animation-duration:13s}
@keyframes sweep{from{transform:translateX(-50%) rotate(-32deg)}to{transform:translateX(-50%) rotate(32deg)}}

/* Калкыган символдор */
.sym{position:fixed;bottom:-10vh;font-family:"Unbounded",sans-serif;font-weight:800;color:var(--cyan);opacity:0;animation:rise linear infinite;pointer-events:none;user-select:none}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  10%{opacity:.35}
  90%{opacity:.25}
  100%{transform:translateY(-120vh) rotate(40deg);opacity:0}
}

main{
  position:relative;z-index:2;
  width:min(1100px,100%);
  padding:24px 20px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:clamp(24px,5vh,56px);
}

/* Лампочка */
.bulb{width:clamp(72px,12vmin,110px);height:auto;animation:drop 1.1s cubic-bezier(.2,1.4,.4,1) both, glow 3.2s 1.1s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,184,31,.5))}50%{filter:drop-shadow(0 0 32px rgba(255,184,31,.95))}}

h1{
  margin:0;
  font-family:"Unbounded","Arial Black",sans-serif;
  font-weight:800;
  font-size:clamp(2rem,7.2vw,5.2rem);
  line-height:1.05;
  letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--paper) 20%,var(--gold) 50%,var(--paper) 80%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise-in .9s .3s both, shine 5s 1.4s linear infinite;
}
@keyframes rise-in{from{opacity:0;letter-spacing:.2em}to{opacity:1;letter-spacing:-.01em}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}

.lead{
  margin:0;font-size:clamp(1rem,2.4vw,1.35rem);font-weight:500;
  color:rgba(241,238,255,.8);
  animation:fade .8s .9s both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Турлар */
.rounds{
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,3vw,32px);
  width:100%;
}
.round{
  --c:var(--cyan);
  position:relative;
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  min-height:clamp(150px,26vh,240px);
  border-radius:28px 28px 8px 8px;
  background:linear-gradient(160deg,rgba(75,63,214,.85),rgba(35,38,122,.9));
  color:var(--paper);
  font-family:"Unbounded",sans-serif;font-weight:800;
  font-size:clamp(1.6rem,4.4vw,3rem);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 0 0 2px var(--c),0 0 24px -4px var(--c),0 18px 0 -8px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .25s;
  animation:pop .7s both;
  overflow:hidden;
}
.round:nth-child(1){animation-delay:1.1s}
.round:nth-child(2){--c:var(--gold);animation-delay:1.25s}
.round:nth-child(3){--c:#ff5fa2;animation-delay:1.4s}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.8)}to{opacity:1;transform:none}}
.round::before{ /* жарык тилкеси */
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);animation:swipe 4s infinite;
}
.round:nth-child(2)::before{animation-delay:.6s}
.round:nth-child(3)::before{animation-delay:1.2s}
@keyframes swipe{0%,60%{left:-60%}100%{left:130%}}
.round small{
  font-family:"Manrope",sans-serif;font-weight:700;
  font-size:clamp(.8rem,1.6vw,1.05rem);color:var(--c);letter-spacing:.02em;
}
.round:hover,.round:focus-visible{
  transform:translateY(-10px) scale(1.04);
  box-shadow:inset 0 0 0 3px var(--c),0 0 48px 2px var(--c),0 26px 0 -8px rgba(0,0,0,.35);
  outline:none;
}
.round:active{transform:translateY(2px) scale(.97)}
.round:focus-visible{outline:3px solid var(--paper);outline-offset:4px}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,40px);opacity:0;
  background:var(--gold);color:var(--ink);
  font-family:"Unbounded",sans-serif;font-weight:600;
  padding:14px 26px;border-radius:999px;
  transition:.35s cubic-bezier(.2,1.4,.4,1);z-index:5;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:720px){
  body{overflow:auto;place-items:start center}
  .rounds{grid-template-columns:1fr}
  .round{min-height:110px;flex-direction:row;gap:16px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="beams" aria-hidden="true"><div class="beam"></div><div class="beam"></div><div class="beam"></div></div>
<div id="symbols" aria-hidden="true"></div>

<main>
  <svg class="bulb" viewBox="0 0 100 130" aria-hidden="true">
    <path d="M50 6C27 6 12 23 12 44c0 14 7 24 15 33 5 6 7 11 7 18h32c0-7 2-12 7-18 8-9 15-19 15-33C88 23 73 6 50 6z" fill="#ffb81f"/>
    <path d="M38 52l12 14 12-14M50 66v28" fill="none" stroke="#0b0d2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="101" width="32" height="9" rx="4.5" fill="#f1eeff"/>
    <rect x="39" y="113" width="22" height="9" rx="4.5" fill="#f1eeff"/>
  </svg>

  <h1>Интеллектуалдык оюн</h1>
  <p class="lead">Билимиңди сынап көр, ой жүгүрт, жеңишке жет!</p>

  <div class="rounds">
    <!-- Ссылкаларды ушул жерден алмаштырыңыз: href="..." -->
    <a class="round" href="log_game.html">1-тур<small>Логика</small></a>
    <a class="round" href="quiz_game.html">2-тур<small>Баллдык суроолор</small></a>
    <a class="round" href="mozaika/Ампер.html">3-тур<small>Мозайка</small></a>
  </div>
</main>


<script>
// Калкыган символдор
(function(){
  var chars=["?","π","∑","√","∞","Ω","!","≈","∫","♞"];
  var box=document.getElementById("symbols");
  for(var i=0;i<22;i++){
    var s=document.createElement("span");
    s.className="sym";
    s.textContent=chars[i%chars.length];
    s.style.left=(Math.random()*96)+"vw";
    s.style.fontSize=(1.4+Math.random()*3)+"rem";
    s.style.animationDuration=(10+Math.random()*14)+"s";
    s.style.animationDelay=(-Math.random()*20)+"s";
    s.style.color=["#3be3e0","#ffb81f","#b9a8ff"][i%3];
    box.appendChild(s);
  }
})();

</script>
</body>
</html>
